services:
  postgres:
    image: postgres:16-alpine
    container_name: souslepommier-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pommier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pommier_secret}
      POSTGRES_DB: ${POSTGRES_DB:-souslepommier}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pommier} -d ${POSTGRES_DB:-souslepommier}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: souslepommier-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-pommier}:${POSTGRES_PASSWORD:-pommier_secret}@postgres:5432/${POSTGRES_DB:-souslepommier}
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production}
      SETUP_SECRET: ${SETUP_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-28800}
      PORT: 3001
    volumes:
      - uploads_data:/app/uploads
    expose:
      - '3001'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: souslepommier-web
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - '80'

volumes:
  postgres_data:
  uploads_data:
