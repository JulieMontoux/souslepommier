version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: souslepommier-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: souslepommier
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: souslepommier-app
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/souslepommier
    ports:
      - '3000:3000'
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
