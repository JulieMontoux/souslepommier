services:
  postgres:
    image: postgres:16-alpine
    container_name: souslepommier-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pommier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pommier_secret}
      POSTGRES_DB: ${POSTGRES_DB:-souslepommier}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pommier} -d ${POSTGRES_DB:-souslepommier}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/juliemontoux/souslepommier-api:latest
    container_name: souslepommier-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-pommier}:${POSTGRES_PASSWORD:-pommier_secret}@postgres:5432/${POSTGRES_DB:-souslepommier}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      SIGNING_SECRET: ${SIGNING_SECRET:?SIGNING_SECRET requis}
      SETUP_SECRET: ${SETUP_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-28800}
      PORT: 3001
      EMAIL_SERVER_HOST: ${EMAIL_SERVER_HOST:-}
      EMAIL_SERVER_PORT: ${EMAIL_SERVER_PORT:-587}
      EMAIL_SERVER_USER: ${EMAIL_SERVER_USER:-}
      EMAIL_SERVER_PASSWORD: ${EMAIL_SERVER_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      APP_URL: ${APP_URL:?APP_URL requis}
    volumes:
      - uploads_data:/app/uploads
    expose:
      - '3001'

  web:
    image: ghcr.io/juliemontoux/souslepommier-web:latest
    container_name: souslepommier-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8080:80'

  watchtower:
    image: containrrr/watchtower
    container_name: souslepommier-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: 60
      WATCHTOWER_CLEANUP: 'true'
      WATCHTOWER_INCLUDE_STOPPED: 'false'
      WATCHTOWER_NOTIFICATIONS_LEVEL: warn

volumes:
  postgres_data:
  uploads_data:
