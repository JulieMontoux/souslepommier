name: CI / Deploy

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # lowercased automatically by github.repository
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/souslepommier-api
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/souslepommier-web

jobs:
  # ────────────────────────────────────────────────
  # 1. CI — runs on every push / PR
  # ────────────────────────────────────────────────
  ci:
    name: Lint · Type · Test
    runs-on: ubuntu-latest

    env:
      SIGNING_SECRET: ci-test-secret-minimum-32-bytes!!
      SESSION_MAX_AGE: '3600'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run build --workspace=packages/database

      - name: Lint (web)
        run: npm run lint --workspace=apps/web
        continue-on-error: false

      - name: Type check (web)
        run: npm run type-check --workspace=apps/web

      - name: Type check (api)
        run: npm run type-check --workspace=apps/api

      - name: Tests (web)
        run: npm run test --workspace=apps/web

      - name: Tests (api)
        run: npm run test --workspace=apps/api

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # ────────────────────────────────────────────────
  # 2. Build & Push — only on merge to main
  # ────────────────────────────────────────────────
  deploy:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata — API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build & push — API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata — Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build & push — Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Images poussées :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.meta-api.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.meta-web.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Sur Proxmox : \`docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d\`" >> $GITHUB_STEP_SUMMARY
